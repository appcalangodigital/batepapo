<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Efêmero</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <div id="setup-screen" class="flex-1 flex items-center justify-center p-4">
    <div class="bg-slate-800 p-6 rounded-2xl shadow-xl w-full max-w-md border border-slate-700">
      <h1 class="text-2xl font-bold text-emerald-400 mb-2">Chat Directo</h1>
      <p class="text-slate-400 text-sm mb-6">Conversa instantânea e sem salvamento de histórico.</p>
      
      <label class="block text-xs font-semibold text-slate-300 uppercase mb-2">Seu Nome / Apelido</label>
      <input type="text" id="username-input" placeholder="Ex: Carlos" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-white mb-4 focus:outline-none focus:border-emerald-500">
      
      <button id="start-btn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-lg transition">Entrar na Sala</button>
    </div>
  </div>

  <div id="chat-screen" class="hidden flex-1 flex flex-col h-screen max-w-4xl mx-auto w-full border-x border-slate-800 bg-slate-950">
    <header class="p-4 border-b border-slate-800 bg-slate-900 flex justify-between items-center">
      <div>
        <h2 class="font-bold text-emerald-400" id="room-title">Sala Segura</h2>
        <span id="status-badge" class="text-xs px-2 py-0.5 rounded bg-amber-500/10 text-amber-400 border border-amber-500/20">Conectando...</span>
      </div>
      <button id="share-btn" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 text-sm px-3 py-2 rounded-lg transition flex items-center gap-2">
        Copiar Link
      </button>
    </header>

    <div id="messages" class="flex-1 overflow-y-auto p-4 space-y-3"></div>

    <form id="chat-form" class="p-4 border-t border-slate-800 bg-slate-900 flex gap-2">
      <input type="text" id="message-input" placeholder="Digite uma mensagem..." class="flex-1 bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-emerald-500" autocomplete="off">
      <button type="submit" id="send-btn" class="bg-emerald-600 hover:bg-emerald-500 text-white px-5 rounded-lg font-semibold transition">Enviar</button>
    </form>
  </div>

  <script>
    const setupScreen = document.getElementById('setup-screen');
    const chatScreen = document.getElementById('chat-screen');
    const usernameInput = document.getElementById('username-input');
    const startBtn = document.getElementById('start-btn');
    const messagesDiv = document.getElementById('messages');
    const chatForm = document.getElementById('chat-form');
    const messageInput = document.getElementById('message-input');
    const statusBadge = document.getElementById('status-badge');
    const shareBtn = document.getElementById('share-btn');

    let username = '';
    let roomId = '';
    let socket = null;

    const urlParams = new URLSearchParams(window.location.search);
    roomId = urlParams.get('room');

    if (!roomId) {
      roomId = 'sala_' + Math.random().toString(36).substring(2, 9);
      const newUrl = `${window.location.origin}${window.location.pathname}?room=${roomId}`;
      window.history.replaceState({}, '', newUrl);
    }

    const roomUrl = window.location.href;
    shareBtn.onclick = () => {
      navigator.clipboard.writeText(roomUrl);
      alert('Link da sala copiado! Envie para a sua amiga.');
    };

    startBtn.addEventListener('click', () => {
      username = usernameInput.value.trim() || 'Anônimo';
      if (!username) return;

      setupScreen.classList.add('hidden');
      chatScreen.classList.remove('hidden');

      initChat();
    });

    function initChat() {
      socket = io('https://chat-server-relay.onrender.com', {
        query: { room: roomId }
      });

      socket.on('connect', () => {
        statusBadge.textContent = 'Conectado';
        statusBadge.className = 'text-xs px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/20';
        appendSystemMessage('Você entrou na sala segura. As mensagens não são salvas.');
      });

      socket.on('disconnect', () => {
        statusBadge.textContent = 'Desconectado';
        statusBadge.className = 'text-xs px-2 py-0.5 rounded bg-red-500/10 text-red-400 border border-red-500/20';
        appendSystemMessage('Conexão perdida com o servidor.');
      });

      socket.on('message', (data) => {
        appendMessage(data.user, data.text, 'other');
      });
    }

    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = messageInput.value.trim();
      if (!text || !socket) return;

      socket.emit('message', { room: roomId, user: username, text: text });
      
      appendMessage('Você', text, 'me');
      messageInput.value = '';
    });

    function appendMessage(sender, text, type) {
      const msgWrapper = document.createElement('div');
      msgWrapper.className = `flex flex-col ${type === 'me' ? 'items-end' : 'items-start'}`;
      
      const msgBubble = document.createElement('div');
      msgBubble.className = `max-w-[80%] rounded-2xl px-4 py-2 text-sm ${type === 'me' ? 'bg-emerald-600 text-white rounded-br-none' : 'bg-slate-800 text-slate-100 rounded-bl-none'}`;
      
      msgBubble.innerHTML = `<span class="block text-[10px] text-slate-300 font-bold mb-0.5">${sender}</span><div>${text}</div>`;
      msgWrapper.appendChild(msgBubble);
      messagesDiv.appendChild(msgWrapper);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function appendSystemMessage(text) {
      const sysMsg = document.createElement('div');
      sysMsg.className = 'text-center text-xs text-slate-400 bg-slate-900/50 py-1 px-3 rounded-full mx-auto my-2 border border-slate-800 max-w-fit';
      sysMsg.textContent = text;
      messagesDiv.appendChild(sysMsg);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }
  </script>
</body>
</html>
