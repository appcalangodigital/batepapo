<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Privado Directo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <div id="setup-screen" class="flex-1 flex items-center justify-center p-4">
    <div class="bg-slate-800 p-6 rounded-2xl shadow-xl w-full max-w-md border border-slate-700">
      <h1 class="text-2xl font-bold text-emerald-400 mb-2">Chat Directo</h1>
      <p class="text-slate-400 text-sm mb-6">Converse em tempo real de ponta a ponta sem registros em servidores.</p>
      
      <label class="block text-xs font-semibold text-slate-300 uppercase mb-2">Seu Nome / Apelido</label>
      <input type="text" id="username-input" placeholder="Ex: Carlos" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-white mb-4 focus:outline-none focus:border-emerald-500">
      
      <button id="start-btn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-lg transition">Entrar na Sala</button>
    </div>
  </div>

  <div id="chat-screen" class="hidden flex-1 flex flex-col h-screen max-w-4xl mx-auto w-full border-x border-slate-800 bg-slate-950">
    <header class="p-4 border-b border-slate-800 bg-slate-900 flex justify-between items-center">
      <div>
        <h2 class="font-bold text-emerald-400" id="room-title">Sala de Bate-papo</h2>
        <span id="status-badge" class="text-xs px-2 py-0.5 rounded bg-amber-500/10 text-amber-400 border border-amber-500/20">Aguardando participante...</span>
      </div>
      <button id="share-btn" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 text-sm px-3 py-2 rounded-lg transition flex items-center gap-2">
        Copiar Link
      </button>
    </header>

    <div id="messages" class="flex-1 overflow-y-auto p-4 space-y-3"></div>

    <form id="chat-form" class="p-4 border-t border-slate-800 bg-slate-900 flex gap-2">
      <input type="text" id="message-input" placeholder="Digite uma mensagem..." class="flex-1 bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-emerald-500">
      <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-white px-5 rounded-lg font-semibold transition">Enviar</button>
    </form>
  </div>

  <script>
    const setupScreen = document.getElementById('setup-screen');
    const chatScreen = document.getElementById('chat-screen');
    const usernameInput = document.getElementById('username-input');
    const startBtn = document.getElementById('start-btn');
    const messagesDiv = document.getElementById('messages');
    const chatForm = document.getElementById('chat-form');
    const messageInput = document.getElementById('message-input');
    const statusBadge = document.getElementById('status-badge');
    const shareBtn = document.getElementById('share-btn');

    let peer = null;
    let conn = null;
    let username = '';
    
    const urlParams = new URLSearchParams(window.location.search);
    const targetPeerId = urlParams.get('room');

    startBtn.addEventListener('click', () => {
      username = usernameInput.value.trim() || 'Anônimo';
      setupScreen.classList.add('hidden');
      chatScreen.classList.remove('hidden');
      initPeer();
    });

    function initPeer() {
      peer = new Peer();

      peer.on('open', (id) => {
        if (targetPeerId) {
          connectToPeer(targetPeerId);
        } else {
          const roomUrl = `${window.location.origin}${window.location.pathname}?room=${id}`;
          shareBtn.onclick = () => {
            navigator.clipboard.writeText(roomUrl);
            alert('Link da sala copiado! Envie para outra pessoa.');
          };
        }
      });

      peer.on('connection', (c) => {
        conn = c;
        setupConnection();
      });
    }

    function connectToPeer(id) {
      conn = peer.connect(id);
      setupConnection();
    }

    function setupConnection() {
      conn.on('open', () => {
        statusBadge.textContent = 'Conectado';
        statusBadge.className = 'text-xs px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/20';
        appendSystemMessage('Conexão estabelecida com sucesso!');
      });

      conn.on('data', (data) => {
        appendMessage(data.user, data.text, 'other');
      });

      conn.on('close', () => {
        statusBadge.textContent = 'Desconectado';
        statusBadge.className = 'text-xs px-2 py-0.5 rounded bg-red-500/10 text-red-400 border border-red-500/20';
        appendSystemMessage('O outro participante saiu.');
      });
    }

    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = messageInput.value.trim();
      if (!text || !conn) return;

      conn.send({ user: username, text: text });
      appendMessage('Você', text, 'me');
      messageInput.value = '';
    });

    function appendMessage(sender, text, type) {
      const msgWrapper = document.createElement('div');
      msgWrapper.className = `flex flex-col ${type === 'me' ? 'items-end' : 'items-start'}`;
      
      const msgBubble = document.createElement('div');
      msgBubble.className = `max-w-[80%] rounded-2xl px-4 py-2 text-sm ${type === 'me' ? 'bg-emerald-600 text-white rounded-br-none' : 'bg-slate-800 text-slate-100 rounded-bl-none'}`;
      
      msgBubble.innerHTML = `<span class="block text-[10px] text-slate-300 font-bold mb-0.5">${sender}</span><div>${text}</div>`;
      msgWrapper.appendChild(msgBubble);
      messagesDiv.appendChild(msgWrapper);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function appendSystemMessage(text) {
      const sysMsg = document.createElement('div');
      sysMsg.className = 'text-center text-xs text-slate-500 my-2';
      sysMsg.textContent = text;
      messagesDiv.appendChild(sysMsg);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }
  </script>
</body>
</html>
